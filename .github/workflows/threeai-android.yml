name: 3AI — APK et vérifications Android
on:
  push:
    branches: [jarvis-standalone]
    paths:
      - android/**
      - tools/android_ui_check.py
      - .github/workflows/threeai-android.yml
permissions:
  contents: read
concurrency:
  group: threeai-android
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          gradle-version: '9.6.0'
          cache-disabled: true
      - name: Installer les outils Android
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools emulator'
      - name: Interdire Android WebView dans le code applicatif
        run: |
          if rg -n "android\.webkit|new WebView|WebViewClient" android/app/src; then exit 1; fi
      - name: Compiler les APK indépendants sans clé privée
        working-directory: android
        run: |
          sdkmanager 'platforms;android-37.1' 'build-tools;36.0.0' > /dev/null
          gradle :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Préparer l’APK non signé et l’outil officiel de signature
        run: |
          mkdir -p deliverables
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk deliverables/3AI-0.1.4-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" deliverables/apksigner.jar
          sha256sum deliverables/* > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: threeai-unsigned
          path: deliverables/
          retention-days: 14
      - name: Activer KVM pour les tests Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Vérifier la mémoire, le modèle, les secrets et les écrans sur Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle -p android :app:connectedDebugAndroidTest --console=plain
            python3 tools/android_ui_check.py
      - name: Conserver les preuves de vérification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: threeai-android-qa
          path: |
            qa/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
