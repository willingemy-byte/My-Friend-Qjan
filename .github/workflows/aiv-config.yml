name: AIV centralized config checks
on:
  pull_request:
    paths: ['aiv-v19/**', 'AIV_CONFIG.json', 'AIV_VALUES.json', '.github/workflows/aiv-config.yml']
  push:
    branches: [aiv-config-centralization, aiv-control-reversible-20261002]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 aiv-v19/tools/build_frontend.py --check
      - run: python3 aiv-v19/tools/generate_config.py --check
      - run: python3 aiv-v19/tools/generate_access_policy.py --check
      - run: python3 aiv-v19/tools/list_public_values.py --check
      - run: python3 -m unittest discover -s aiv-v19/tests -p test_public_config.py -v
      - run: python3 -m unittest discover -s aiv-v19/tests -p test_access_policy.py -v
      - run: python3 -m unittest discover -s aiv-v19/tests -p test_config.py -v
      - name: Compile configured pure Java engines
        run: |
          mkdir -p /tmp/aiv-config-classes
          javac -d /tmp/aiv-config-classes aiv-v19/app/src/main/java/fr/erick/journallocal/{AivConfig,AnomalyRules,WorkBudget,AccessPolicy}.java aiv-v19/tests/AccessPolicyTest.java aiv-v19/app/src/main/java/fr/erick/journallocal/{ControlRules,ControlCoordinator}.java aiv-v19/tests/ControlRulesTest.java
          java -cp /tmp/aiv-config-classes fr.erick.journallocal.AccessPolicyTest
          java -cp /tmp/aiv-config-classes fr.erick.journallocal.ControlRulesTest
      - run: bash aiv-v19/tests/run-v23.sh
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/aiv-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/aiv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check startup and control interface
        env:
          NODE_PATH: ${{ runner.temp }}/aiv-browser/node_modules
        run: |
          node aiv-v19/tests/design-control.cjs
          node aiv-v19/tests/developer-control.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aiv-design-preview
          path: |
            /tmp/aiv-startup.png
            /tmp/aiv-shizuku.png
            /tmp/aiv-developer-control.png
          if-no-files-found: ignore
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: aiv-v19/.toolchain
          key: aiv-v32-android35-ndk27d-shizuku-13.1.5
      - name: Compile APK and native resources
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: bash bootstrap-clean-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aiv-config-logo-unsigned
          path: |
            aiv-v19/build/*unsigned.apk
            aiv-v19/build/*unsigned.apk.sha256
          if-no-files-found: error
      - name: Compile free distribution profile
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/access-policy.json')
          data=json.loads(p.read_text())
          data['distribution_profile']='public'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          bash bootstrap-clean-build.sh
          mkdir -p build/free
          cp build/AIV-1.1.5-unsigned.apk build/free/AIV-1.1.5-free-unsigned.apk
          cd build/free
          sha256sum AIV-1.1.5-free-unsigned.apk > AIV-1.1.5-free-unsigned.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aiv-free-unsigned
          path: aiv-v19/build/free/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aiv-signing-tool-public
          path: aiv-v19/.toolchain/sdk/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
