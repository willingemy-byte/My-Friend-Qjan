name: AIV 2.2.2 contextual network regression and build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - aiv-2.2.2-contextual-network
    paths:
      - "aiv-v19/**"
      - ".github/workflows/aiv-2.2.2-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: aiv-v19/.toolchain
          key: aiv-2.2.2-android35-ndk27d-shizuku-13.1.5

      - name: Host test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aiv-test-deps
          curl -fL --retry 5 --retry-delay 2 -o /tmp/aiv-test-deps/json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          curl -fL --retry 5 --retry-delay 2 -o /tmp/aiv-test-deps/sqlite-jdbc.jar https://repo1.maven.org/maven2/org/xerial/sqlite-jdbc/3.46.1.3/sqlite-jdbc-3.46.1.3.jar
          curl -fL --retry 5 --retry-delay 2 -o /tmp/aiv-test-deps/slf4j-api.jar https://repo1.maven.org/maven2/org/slf4j/slf4j-api/2.0.16/slf4j-api-2.0.16.jar
          test -s /tmp/aiv-test-deps/json.jar
          test -s /tmp/aiv-test-deps/sqlite-jdbc.jar
          test -s /tmp/aiv-test-deps/slf4j-api.jar

      - name: Build AIV 2.2.2 unsigned
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          set -euo pipefail
          chmod +x bootstrap-clean-build.sh
          ./bootstrap-clean-build.sh

      - name: Upload AIV 2.2.2 build output
        uses: actions/upload-artifact@v4
        with:
          name: AIV-2.2.2-build
          path: |
            aiv-v19/build/AIV-2.2.2-unsigned.apk
            aiv-v19/build/AIV-2.2.2-unsigned.apk.sha256
            aiv-v19/.toolchain/sdk/build-tools/35.0.0/lib/apksigner.jar
          retention-days: 14
          include-hidden-files: true

      - name: Full convergence regression
        shell: bash
        env:
          AIV_JSON_JAR: /tmp/aiv-test-deps/json.jar
          AIV_SQLITE_JAR: /tmp/aiv-test-deps/sqlite-jdbc.jar
          AIV_SLF4J_JAR: /tmp/aiv-test-deps/slf4j-api.jar
        run: |
          set -euo pipefail
          bash aiv-v19/tests/run-convergence.sh

      - name: AppOps targeted regression
        shell: bash
        env:
          AIV_JSON_JAR: /tmp/aiv-test-deps/json.jar
        run: |
          set -euo pipefail
          rm -rf /tmp/aiv-permission-rules
          mkdir -p /tmp/aiv-permission-rules
          javac -encoding UTF-8             -cp "$AIV_JSON_JAR"             -d /tmp/aiv-permission-rules             aiv-v19/app/src/main/java/fr/erick/journallocal/PermissionUsageRules.java             aiv-v19/tests/PermissionUsageRulesTest.java
          java -cp "/tmp/aiv-permission-rules:$AIV_JSON_JAR" fr.erick.journallocal.PermissionUsageRulesTest

      - name: Verify AIV 2.2.2 artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s aiv-v19/build/AIV-2.2.2-unsigned.apk
          test -s aiv-v19/build/AIV-2.2.2-unsigned.apk.sha256
          grep -q 'android:versionCode="222"' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'android:versionName="2.2.2"' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'successful alternate path still produced user anomaly' aiv-v19/tests/convergence-host.py
          grep -q 'basculements réussis sont exclus des alertes' aiv-v19/app/src/main/java/fr/erick/journallocal/AnomalyRules.java
          sha256sum -c aiv-v19/build/AIV-2.2.2-unsigned.apk.sha256

      - name: Upload AIV 2.2.2 unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: AIV-2.2.2-unsigned
          path: |
            aiv-v19/build/AIV-2.2.2-unsigned.apk
            aiv-v19/build/AIV-2.2.2-unsigned.apk.sha256
            aiv-v19/.toolchain/sdk/build-tools/35.0.0/lib/apksigner.jar
          retention-days: 14
          include-hidden-files: true
