name: Supabase project bootstrap

on:
  push:
    branches: [aiv-v37-recovery]
    paths:
      - ".github/workflows/supabase-setup.yml"

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: aiv-v37-recovery

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Create npm project if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f package.json ]]; then
            npm init -y
          fi

      - name: Install Supabase CLI dev dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install supabase --save-dev
          npx supabase --version
          npx supabase --help >/dev/null

      - name: Install Supabase Plugin for Codex at project scope
        shell: bash
        run: |
          set -euo pipefail
          npx plugins --help >/dev/null
          npx plugins targets || true
          npx plugins add supabase-community/supabase-plugin --target codex --scope project --yes

      - name: Initialize Supabase if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f supabase/config.toml ]]; then
            echo "SUPABASE_ALREADY_INITIALIZED=1"
          else
            npx supabase init
            echo "SUPABASE_ALREADY_INITIALIZED=0"
          fi
          test -s supabase/config.toml

      - name: Verify generated setup
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(!p.devDependencies?.supabase) process.exit(1); console.log('supabase devDependency',p.devDependencies.supabase)"
          npx supabase --version
          test -s package-lock.json
          test -s supabase/config.toml
          git status --short

      - name: Commit project setup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/supabase-setup.yml
          git add -A
          if git diff --cached --quiet; then
            echo "No setup changes to commit"
            exit 0
          fi
          git commit -m "chore: initialize Supabase project tooling"
          git push origin HEAD:aiv-v37-recovery
