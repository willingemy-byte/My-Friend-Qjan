name: AIV - Générer le pointage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier le moteur
        run: python generate_verdicts.py --self-test

      - name: Générer le pointage
        run: python generate_verdicts.py --from-json apps.json --evaluate --output ai_verdicts.json

      - name: Enregistrer le résultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_verdicts.json
          git diff --cached --quiet || git commit -m "AIV: mise à jour du pointage"
          git push
