name: AIV V28 Original Demo UI build

on:
  workflow_dispatch:
  push:
    branches: [aiv-ui-original-demo-v1]
    paths:
      - "aiv-v19/**"
      - ".github/workflows/aiv-v24-shizuku.yml"

permissions:
  contents: read

jobs:
  build-v28:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: aiv-v19/.toolchain
          key: aiv-v28-android35-ndk27d-shizuku-13.1.5

      - name: Build AIV 0.6.28 unsigned
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          chmod +x bootstrap-clean-build.sh
          ./bootstrap-clean-build.sh

      - name: Original demo UI checks
        shell: bash
        run: |
          set -euo pipefail
          node --check <(python3 - <<'PY'
          import re
          from pathlib import Path
          html=Path("aiv-v19/app/src/main/assets/journal.html").read_text(encoding="utf-8")
          scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",html,re.I)
          print("\n;\n".join(scripts))
          PY
          ) || true
          grep -q '>Architecture</button>' aiv-v19/app/src/main/assets/journal.html
          grep -q '>Journal central</button>' aiv-v19/app/src/main/assets/journal.html
          grep -q '>Démo en direct</button>' aiv-v19/app/src/main/assets/journal.html
          grep -q '>Anomalie & restauration</button>' aiv-v19/app/src/main/assets/journal.html
          grep -q '>Faisabilité</button>' aiv-v19/app/src/main/assets/journal.html
          grep -q "window.JournalAndroid" aiv-v19/app/src/main/assets/journal.html
          grep -q "analysisPage" aiv-v19/app/src/main/assets/journal.html
          grep -q "shizukuCleanupRun" aiv-v19/app/src/main/assets/journal.html

      - name: Verify V28 package
        shell: bash
        run: |
          set -euo pipefail
          test -s aiv-v19/build/AIV-0.6.28-unsigned.apk
          test -s aiv-v19/build/AIV-0.6.28-unsigned.apk.sha256
          grep -q 'android:versionName="0.6.28"' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'rikka.shizuku.ShizukuProvider' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'class ShizukuCleanup' aiv-v19/app/src/main/java/fr/erick/journallocal/ShizukuCleanup.java
          sha256sum -c aiv-v19/build/AIV-0.6.28-unsigned.apk.sha256

      - name: Upload AIV V28 unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: AIV-0.6.28-unsigned
          path: |
            aiv-v19/build/AIV-0.6.28-unsigned.apk
            aiv-v19/build/AIV-0.6.28-unsigned.apk.sha256
          retention-days: 14
