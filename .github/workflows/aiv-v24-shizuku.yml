name: AIV V24 Shizuku build

on:
  workflow_dispatch:
  push:
    branches: [aiv-v24-shizuku]
    paths:
      - "aiv-v19/**"
      - ".github/workflows/aiv-v24-shizuku.yml"

permissions:
  contents: read

jobs:
  build-v24:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: aiv-v19/.toolchain
          key: aiv-v24-android35-ndk27d-shizuku-13.1.5

      - name: Build AIV 0.6.24 unsigned
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          chmod +x bootstrap-clean-build.sh
          ./bootstrap-clean-build.sh

      - name: Regression tests
        run: bash aiv-v19/tests/run-v23.sh

      - name: Verify V24 package
        shell: bash
        run: |
          set -euo pipefail
          test -s aiv-v19/build/AIV-0.6.24-unsigned.apk
          test -s aiv-v19/build/AIV-0.6.24-unsigned.apk.sha256
          grep -q 'android:versionName="0.6.24"' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'rikka.shizuku.ShizukuProvider' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'class ShizukuCleanup' aiv-v19/app/src/main/java/fr/erick/journallocal/ShizukuCleanup.java
          sha256sum -c aiv-v19/build/AIV-0.6.24-unsigned.apk.sha256

      - name: Upload AIV V24 unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: AIV-0.6.24-unsigned
          path: |
            aiv-v19/build/AIV-0.6.24-unsigned.apk
            aiv-v19/build/AIV-0.6.24-unsigned.apk.sha256
          retention-days: 14
