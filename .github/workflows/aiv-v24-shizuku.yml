name: AIV V40 nonblocking startup build

on:
  workflow_dispatch:
  push:
    branches: [aiv-v40-ui-nonblocking-startup]
    paths:
      - "aiv-v19/**"
      - ".github/workflows/aiv-v24-shizuku.yml"

permissions:
  contents: read

jobs:
  build-v40:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Reject Supabase Claude MCP integrations
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(supabase|claude|anthropic|\.mcp)(/|$)'; then
            echo "Forbidden remote-integration path detected."
            exit 1
          fi
          if git grep -nEi 'supabase|@supabase|anthropic|claude|modelcontextprotocol|mcpServers' --               aiv-v19/app               aiv-v19/build.py               aiv-v19/bootstrap-clean-build.sh; then
            echo "Forbidden Supabase/Claude/MCP reference detected in AIV runtime/build code."
            exit 1
          fi
          echo "AIV runtime/build code contains no Supabase, Claude, Anthropic or MCP integration."

      - name: Cache Android toolchain
        uses: actions/cache@v6
        with:
          path: aiv-v19/.toolchain
          key: aiv-v32-android35-ndk27d-shizuku-13.1.5

      - name: Build AIV 0.6.40 unsigned
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          chmod +x bootstrap-clean-build.sh
          ./bootstrap-clean-build.sh

      - name: Regression tests
        run: bash aiv-v19/tests/run-v23.sh

      - name: V32.3 UI regression checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'aiv-v32-android-design' aiv-v19/app/src/main/assets/journal.html
          grep -q 'V32 Android UI overlay' aiv-v19/app/src/main/assets/journal.html
          grep -q 'A · Autorisations' aiv-v19/app/src/main/assets/journal.html
          grep -q 'R · Règles' aiv-v19/app/src/main/assets/journal.html
          grep -q 'Applications par catégorie' aiv-v19/app/src/main/assets/journal.html
          grep -q 'trackerMatch' aiv-v19/app/src/main/java/fr/erick/journallocal/MainActivity.java
          grep -q 'aivConfigureBatch' aiv-v19/app/src/main/java/fr/erick/journallocal/MainActivity.java
          grep -q 'aiv-v32-2-investigation' aiv-v19/app/src/main/assets/journal.html
          grep -q 'analysisPageSized' aiv-v19/app/src/main/java/fr/erick/journallocal/MainActivity.java
          grep -q 'trackerPageSized' aiv-v19/app/src/main/java/fr/erick/journallocal/MainActivity.java
          grep -q 'saveUiState' aiv-v19/app/src/main/java/fr/erick/journallocal/MainActivity.java
          grep -q 'trackerGroups' aiv-v19/app/src/main/java/fr/erick/journallocal/MainActivity.java
          grep -q 'trackerJourneys' aiv-v19/app/src/main/java/fr/erick/journallocal/MainActivity.java
          grep -q 'trackerTrail' aiv-v19/app/src/main/java/fr/erick/journallocal/MainActivity.java
          grep -q 'Traqueurs · trajets observés' aiv-v19/app/src/main/assets/journal.html
          grep -q 'Lots 50 000 terminés' aiv-v19/app/src/main/assets/journal.html

      - name: Verify V40 package
        shell: bash
        run: |
          set -euo pipefail
          test -s aiv-v19/build/AIV-0.6.40-unsigned.apk
          test -s aiv-v19/build/AIV-0.6.40-unsigned.apk.sha256
          grep -q 'android:versionName="0.6.40"' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'rikka.shizuku.ShizukuProvider' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'class ShizukuCleanup' aiv-v19/app/src/main/java/fr/erick/journallocal/ShizukuCleanup.java
          sha256sum -c aiv-v19/build/AIV-0.6.40-unsigned.apk.sha256

      - name: Upload AIV V40 unsigned APK
        uses: actions/upload-artifact@v6
        with:
          name: AIV-0.6.40-unsigned
          path: |
            aiv-v19/build/AIV-0.6.40-unsigned.apk
            aiv-v19/build/AIV-0.6.40-unsigned.apk.sha256
            aiv-v19/.toolchain/sdk/build-tools/35.0.0/lib/apksigner.jar
          retention-days: 14
          include-hidden-files: true
