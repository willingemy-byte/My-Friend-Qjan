name: AIV 2.0.4 build

on:
  workflow_dispatch:
  push:
    branches: [aiv-2.0.4-tables-supabase]
    paths:
      - "aiv-v19/**"
      - ".github/workflows/aiv-2.0.4-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: aiv-v19/.toolchain
          key: aiv-2.0.4-android35-ndk27d-shizuku-13.1.5
      - name: Build AIV 2.0.4 unsigned
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          set -euo pipefail
          chmod +x bootstrap-clean-build.sh
          ./bootstrap-clean-build.sh
      - name: Regression tests
        continue-on-error: true
        run: bash aiv-v19/tests/run-v23.sh
      - name: Verify target
        run: |
          set -euo pipefail
          grep -q 'android:versionName="2.0.4"' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'aiv-control-waiter' aiv-v19/app/src/main/java/fr/erick/journallocal/ControlShell.java
          ! grep -q 'process.exitValue()' aiv-v19/app/src/main/java/fr/erick/journallocal/ControlShell.java
          test -s aiv-v19/build/AIV-2.0.4-unsigned.apk
          sha256sum -c aiv-v19/build/AIV-2.0.4-unsigned.apk.sha256
      - name: Publish unsigned APK on branch
        run: |
          set -euo pipefail
          mkdir -p build-output
          cp aiv-v19/build/AIV-2.0.4-unsigned.apk build-output/AIV-2.0.4-unsigned.apk
          cp aiv-v19/build/AIV-2.0.4-unsigned.apk.sha256 build-output/AIV-2.0.4-unsigned.apk.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-output/AIV-2.0.4-unsigned.apk build-output/AIV-2.0.4-unsigned.apk.sha256
          git commit -m "Publish AIV 2.0.4 unsigned APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: AIV-2.0.4-unsigned
          path: |
            aiv-v19/build/AIV-2.0.4-unsigned.apk
            aiv-v19/build/AIV-2.0.4-unsigned.apk.sha256
          retention-days: 14
