name: AIV 2.0.4 build

on:
  workflow_dispatch:
  push:
    branches: [aiv-2.0.4-tables-supabase]
    paths:
      - "aiv-v19/**"
      - ".github/workflows/aiv-2.0.4-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Android toolchain
        uses: actions/cache@v6.1.0
        with:
          path: aiv-v19/.toolchain
          key: aiv-2.0.4-android35-ndk27d-shizuku-13.1.5
      - name: Build AIV 2.0.4 unsigned
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          set -euo pipefail
          chmod +x bootstrap-clean-build.sh
          ./bootstrap-clean-build.sh
      - name: Regression tests
        continue-on-error: true
        run: bash aiv-v19/tests/run-v23.sh
      - name: Verify target
        run: |
          set -euo pipefail
          grep -q 'android:versionName="2.0.4"' aiv-v19/app/src/main/AndroidManifest.xml
          grep -q 'aiv-control-waiter' aiv-v19/app/src/main/java/fr/erick/journallocal/ControlShell.java
          ! grep -q 'process.exitValue()' aiv-v19/app/src/main/java/fr/erick/journallocal/ControlShell.java
          test -s aiv-v19/build/AIV-2.0.4-unsigned.apk
          sha256sum -c aiv-v19/build/AIV-2.0.4-unsigned.apk.sha256
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: AIV-2.0.4-unsigned
          path: |
            aiv-v19/build/AIV-2.0.4-unsigned.apk
            aiv-v19/build/AIV-2.0.4-unsigned.apk.sha256
            aiv-v19/.toolchain/sdk/build-tools/35.0.0/lib/apksigner.jar
          retention-days: 14
