name: AIV Android test build

on:
  workflow_dispatch:
  push:
    branches: [aiv-build-ci]
    paths:
      - "aiv-v19/**"
      - ".github/workflows/aiv-android-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache Android toolchain
        uses: actions/cache@v4
        with:
          path: aiv-v19/.toolchain
          key: aiv-android35-ndk27d-ecj340
      - name: Build unsigned APK
        working-directory: aiv-v19
        env:
          AIV_BUILD_MODE: unsigned
        run: |
          chmod +x bootstrap-clean-build.sh
          ./bootstrap-clean-build.sh
      - name: Verify artifact exists
        run: |
          test -f aiv-v19/build/AIV-0.6.19-unsigned.apk
          test -f aiv-v19/build/AIV-0.6.19-unsigned.apk.sha256
          cat aiv-v19/build/AIV-0.6.19-unsigned.apk.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIV-0.6.19-unsigned-test
          path: |
            aiv-v19/build/AIV-0.6.19-unsigned.apk
            aiv-v19/build/AIV-0.6.19-unsigned.apk.sha256
          retention-days: 30
