name: TreeAI — test modèle configurable

on:
  push:
    branches: [jarvis-standalone]
    paths:
      - server/model_client.py
      - tests/test_model_client.py
      - tools/test_ollama.py
      - .github/workflows/treeai-ollama-test.yml

permissions:
  contents: read

concurrency:
  group: treeai-ollama-test
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/jarvis-standalone'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: jarvis
    steps:
      - name: Lire le code du commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Vérifier les changements de fournisseur sans réseau
        run: python3 -m unittest discover -s tests -v
      - name: Appeler Gemma 4 une seule fois avec les crédits disponibles
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TREEAI_BASE_URL: https://ollama.com/v1
          TREEAI_MODEL: gemma4:31b
          TREEAI_KEY_ENV: OLLAMA_API_KEY
        run: python3 tools/test_ollama.py
